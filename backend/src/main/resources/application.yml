server:
  port: ${PORT:8090}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: pharma-erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/PHARMA_ERP?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Parallel tickets own disjoint version ranges and may merge in any order.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

pharma:
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      ttl: ${JWT_TTL:PT1H}
      cookie-name: token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
