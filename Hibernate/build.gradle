apply plugin: 'java-library'

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.guava:guava:23.0'
    api group: 'org.hibernate', name: 'hibernate-core', version: '5.2.12.Final'
    api group: 'io.jsonwebtoken', name: 'jjwt', version: '0.2'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '5.1.6'
    api group: 'com.google.code.gson', name: 'gson', version: '2.8.2'
    implementation group: 'org.hibernate', name: 'hibernate-validator', version: '5.4.1.Final'

    testImplementation 'junit:junit:4.12'
}


