name: CI

on:
  push:
    branches: ["devin/**"]
  pull_request:
    branches: ["devin/hcl-pharmaerp-modernisation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests use Testcontainers (MySQL 8) against the runner's Docker daemon.
      - name: ./gradlew build
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  compose:
    name: Docker Compose estate smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build --wait
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx (http://localhost:8080)
        run: |
          set -eux
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
          curl -fsS http://localhost:8080/signin | grep -qi '<div id="root">'
          curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/does-not-matter)" = "401"
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
