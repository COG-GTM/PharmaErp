# Rendered by the nginx image entrypoint (envsubst) into /etc/nginx/conf.d/default.conf.
# Only ${BACKEND_URL} is substituted; nginx runtime variables are left untouched.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so a restarted backend container is re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend ${BACKEND_URL};

    # Inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 60s;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend: REST API, legacy-compat auth routes, health/info and OpenAPI docs.
    location /api/ {
        proxy_pass $backend;
    }
    location = /login {
        proxy_pass $backend;
    }
    location = /token {
        proxy_pass $backend;
    }
    location = /redirect {
        proxy_pass $backend;
    }
    location /actuator/ {
        proxy_pass $backend;
    }
    location /v3/api-docs {
        proxy_pass $backend;
    }
    location = /swagger-ui.html {
        proxy_pass $backend;
    }
    location /swagger-ui/ {
        proxy_pass $backend;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: client-side routes fall back to index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
