# Brings up the PharmaErp web client together with the MySQL database it needs.
#
# Connection details mirror Hibernate/src/main/resources/hibernate.cfg.xml:
#   database : PHARMA_ERP
#   user     : root
#   password : admin
# Override these via a .env file or shell environment for anything beyond local
# development (see the README "Configuration" section).

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-admin}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-PHARMA_ERP}"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Creates the schema/tables on first startup of an empty data volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match the database service name above so the baked-in
        # hibernate.cfg.xml resolves the MySQL host on the compose network.
        DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
