allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    version = '1.0'
    apply plugin: 'java'
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

group 'Pharma'
version '1.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'war'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
